<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Chart — multi-sim timeline</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --panel-inset: #111319; --panel-raised: #1d2029;
    --line: #2a2e3a; --text: #d8dbe4; --dim: #8b90a0; --muted: #6b7080;
    --amber: #e0b34c; --cyan: #4cc4d6; --green: #5fcf6b; --red: #e0584c;
    --violet: #b58cff; --pink: #ff8cc6; --lime: #a8e04c; --blue: #5b8def;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .03em; }
  header .sub { color: var(--dim); font-size: 11px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); display: inline-block; }
  .live-dot.stale { background: var(--muted); box-shadow: none; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .controls button { background: var(--panel-inset); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .controls button.active { color: var(--amber); border-color: var(--amber); }
  .controls label { color: var(--dim); display: flex; align-items: center; gap: 5px; }
  main { padding: 14px 18px; }
  .chartwrap { background: var(--panel-inset); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; position: relative; }
  canvas { width: 100%; height: 460px; display: block; }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 12px; }
  #legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 1; }
  #legend .item.off { opacity: .35; text-decoration: line-through; }
  #legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  #legend .item small { color: var(--dim); }
  #status { color: var(--dim); font-size: 11px; margin-top: 8px; min-height: 16px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body data-page="simchart">
<header>
  <span class="live-dot" id="dot"></span>
  <h1>Sim Chart</h1>
  <span class="sub">exp / circle timeline · color = guild · mixed groups on one world</span>
  <div class="controls">
    <span style="color:var(--dim);font-size:11px">metric:</span>
    <button data-metric="ranks" class="active">Ranks (exp)</button>
    <button data-metric="kills">Kills</button>
    <button data-metric="circle">Circle</button>
    <label><input type="checkbox" id="markCircle" checked> circle markers</label>
    <span id="updated" class="sub"></span>
  </div>
</header>
<main>
  <div class="chartwrap"><canvas id="cv"></canvas></div>
  <div id="legend"></div>
  <div id="status">polling public/live …</div>
</main>
<script>
const GUILD_COLORS = {
  barbarian: '#e0b34c', warmage: '#4cc4d6', cleric: '#5fcf6b', warrior: '#e0584c',
  rogue: '#b58cff', ranger: '#a8e04c', bard: '#ff8cc6', paladin: '#5b8def',
  empath: '#e0b34c', sorcerer: '#4cc4d6', monk: '#a8e04c', wizard: '#5b8def',
};
const FALLBACK = ['#e0b34c','#4cc4d6','#5fcf6b','#e0584c','#b58cff','#a8e04c','#ff8cc6','#5b8def'];
const LIVE = '/live/';
let metric = 'ranks';
let markCircle = true;
let series = new Map(); // key -> {guild, variant, run, color, points:[{t,circle,kills,ranks}], maxCircle}
let hidden = new Set();

function guildFromName(name) {
  const m = /^(?:fidelity-)?([a-z]+)-/.exec(name);
  return m ? m[1] : (name.startsWith('warmage') ? 'warmage' : 'unknown');
}
function colorFor(guild, idx) {
  return GUILD_COLORS[guild] || FALLBACK[idx % FALLBACK.length];
}

async function fetchText(u) {
  try { const r = await fetch(u); if (!r.ok) return null; return await r.text(); }
  catch { return null; }
}

async function poll() {
  const idx = await fetchText(LIVE + 'index.json');
  let names = [];
  try { names = JSON.parse(idx || '[]'); } catch {}
  const simLogs = names.filter(n => /^fidelity-/.test(n) || /^warmage-/.test(n) || /sim/.test(n));
  let liveCount = 0;
  let gi = 0;
  for (const n of simLogs) {
    const txt = await fetchText(LIVE + n + '.log');
    if (txt == null) continue;
    const guild = guildFromName(n);
    const samples = [];
    for (const line of txt.split('\n')) {
      if (!line.startsWith('[sample] ')) continue;
      try { samples.push(JSON.parse(line.slice(9))); } catch {}
    }
    if (!samples.length) continue;
    liveCount++;
    const key = n;
    const variant = samples[0].variant || '-';
    const run = samples[0].run || '-';
    let color = series.get(key)?.color;
    if (!color) { color = colorFor(guild, gi++); }
    const maxCircle = Math.max(...samples.map(s => s.circle || 1));
    series.set(key, { guild, variant, run, color, points: samples, maxCircle, name: n });
  }
  // prune series no longer present
  for (const k of [...series.keys()]) if (!simLogs.includes(k.replace(/\.log$/, ''))) series.delete(k);
  draw();
  const dot = document.getElementById('dot');
  const now = Date.now();
  dot.classList.toggle('stale', liveCount === 0);
  document.getElementById('status').textContent =
    `${liveCount} active sim${liveCount === 1 ? '' : 's'} · ${series.size} series · ` +
    `metric: ${metric}` + (liveCount ? '' : ' — no sims running');
  document.getElementById('updated').textContent = new Date().toLocaleTimeString();
  setTimeout(poll, 2000);
}

function draw() {
  const cv = document.getElementById('cv');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#111319'; ctx.fillRect(0, 0, w, h);

  const active = [...series.values()].filter(s => !hidden.has(s.name));
  if (!active.length) {
    ctx.fillStyle = '#6b7080'; ctx.font = '14px ui-monospace';
    ctx.fillText('no sim data — launch a benchmark or bot and watch it plot', 20, h / 2);
    document.getElementById('legend').innerHTML = '';
    return;
  }
  // axis ranges
  let maxT = 1, maxY = 1, maxC = 1;
  for (const s of active) {
    for (const p of s.points) {
      maxT = Math.max(maxT, p.t || 0);
      maxY = Math.max(maxY, metric === 'ranks' ? (p.ranks || 0) : metric === 'kills' ? (p.kills || 0) : (p.circle || 1));
      maxC = Math.max(maxC, p.circle || 1);
    }
  }
  if (metric === 'circle') maxY = Math.max(maxY, 1);
  const padL = 52, padR = 14, padT = 14, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const X = t => padL + (t / maxT) * plotW;
  const Y = v => padT + plotH - (v / maxY) * plotH;

  // grid + axis labels
  ctx.strokeStyle = '#2a2e3a'; ctx.fillStyle = '#6b7080'; ctx.font = '10px ui-monospace';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = padT + (plotH * i) / 4;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(String(Math.round(maxY * (1 - i / 4))), 6, yy + 3);
  }
  for (let i = 0; i <= 5; i++) {
    const xx = padL + (plotW * i) / 5;
    ctx.fillText(String(Math.round(maxT * i / 5)) + 'm', xx - 8, h - 10);
  }

  // series
  for (const s of active) {
    if (s.points.length < 1) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.8; ctx.beginPath();
    let started = false;
    let lastCircle = null;
    for (const p of s.points) {
      const x = X(p.t || 0), y = Y(metric === 'ranks' ? (p.ranks || 0) : metric === 'kills' ? (p.kills || 0) : (p.circle || 1));
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      if (markCircle && p.circle && p.circle !== lastCircle && lastCircle !== null) {
        // circle-up marker: vertical tick + label
        ctx.save(); ctx.strokeStyle = s.color; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke(); ctx.restore();
        ctx.fillStyle = s.color; ctx.font = '9px ui-monospace';
        ctx.fillText('c' + p.circle, x + 2, padT + 10);
      }
      lastCircle = p.circle || 1;
    }
    ctx.stroke();
    // end dot
    const last = s.points[s.points.length - 1];
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(X(last.t || 0), Y(metric === 'ranks' ? (last.ranks||0) : metric==='kills'?(last.kills||0):(last.circle||1)), 3, 0, 7); ctx.fill();
  }

  // legend
  const lg = document.getElementById('legend');
  lg.innerHTML = '';
  for (const s of series.values()) {
    const div = document.createElement('div');
    div.className = 'item' + (hidden.has(s.name) ? ' off' : '');
    div.innerHTML = `<span class="sw" style="background:${s.color}"></span>${s.guild} <small>${s.variant}</small>`;
    div.title = s.name + (metric === 'circle' ? '' : '');
    div.onclick = () => { hidden.has(s.name) ? hidden.delete(s.name) : hidden.add(s.name); draw(); renderLegend(); };
    lg.appendChild(div);
  }
}
function renderLegend() { draw(); }

document.querySelectorAll('.controls button[data-metric]').forEach(b => {
  b.onclick = () => {
    metric = b.dataset.metric;
    document.querySelectorAll('.controls button[data-metric]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    draw();
  };
});
document.getElementById('markCircle').onchange = e => { markCircle = e.target.checked; draw(); };

poll();
</script>
</body>
</html>
